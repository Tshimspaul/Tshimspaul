# PostgreSQL and Redis for local development (Docker Desktop on Windows).
# Django, the Celery worker and the Vite dev server run natively.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: realstory
      POSTGRES_USER: realstory
      POSTGRES_PASSWORD: realstory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
